name: Test prefix for environment variable names
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Get HEAD SHA
        id: head
        run: |
          SHA=$(git rev-parse HEAD)
          SHORT=$(git rev-parse --short HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"

      - id: action
        uses: .
        with:
          name: COMMIT
          revision: ${{ steps.head.outputs.sha }}
          prefix: "MY_"

      - name: Assert prefixed environment variables are published
        env:
          EXPECTED_REVISION: ${{ steps.head.outputs.sha }}
          EXPECTED_SHORT: ${{ steps.head.outputs.short }}
        run: |
          echo "MY_COMMIT env: $MY_COMMIT"
          echo "MY_COMMIT_SHORT env: $MY_COMMIT_SHORT"
          if [ "$MY_COMMIT" != "$EXPECTED_REVISION" ]; then
            echo "FAIL: MY_COMMIT env var mismatch (got '$MY_COMMIT', expected '$EXPECTED_REVISION')"
            exit 1
          fi
          if [ "$MY_COMMIT_SHORT" != "$EXPECTED_SHORT" ]; then
            echo "FAIL: MY_COMMIT_SHORT env var mismatch (got '$MY_COMMIT_SHORT', expected '$EXPECTED_SHORT')"
            exit 1
          fi
          echo "PASS: prefixed environment variables published correctly"

      - name: Assert outputs are still set correctly
        env:
          ACTUAL_REVISION: ${{ steps.action.outputs.revision }}
          ACTUAL_SHORT: ${{ steps.action.outputs.short }}
          EXPECTED_REVISION: ${{ steps.head.outputs.sha }}
          EXPECTED_SHORT: ${{ steps.head.outputs.short }}
        run: |
          echo "revision output: $ACTUAL_REVISION"
          echo "short output: $ACTUAL_SHORT"
          if [ "$ACTUAL_REVISION" != "$EXPECTED_REVISION" ]; then
            echo "FAIL: revision output mismatch"
            exit 1
          fi
          if [ "$ACTUAL_SHORT" != "$EXPECTED_SHORT" ]; then
            echo "FAIL: short output mismatch"
            exit 1
          fi
          echo "PASS: outputs are correct with prefix"

name: Test prefix for environment variables
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        with:
          name: GITHUB_SHA
          prefix: "MY_"
      - name: Assert prefixed environment variables are published
        env:
          SHORT: ${{ steps.action.outputs.short }}
          REVISION: ${{ steps.action.outputs.revision }}
        run: |
          echo "revision: $REVISION"
          echo "short: $SHORT"
          echo "MY_GITHUB_SHA env: $MY_GITHUB_SHA"
          echo "MY_GITHUB_SHA_SHORT env: $MY_GITHUB_SHA_SHORT"
          if [ -z "$REVISION" ]; then
            echo "FAIL: revision output is empty"
            exit 1
          fi
          if [ -z "$SHORT" ]; then
            echo "FAIL: short output is empty"
            exit 1
          fi
          if [ -z "$MY_GITHUB_SHA" ]; then
            echo "FAIL: MY_GITHUB_SHA env var is empty (prefix not applied)"
            exit 1
          fi
          if [ -z "$MY_GITHUB_SHA_SHORT" ]; then
            echo "FAIL: MY_GITHUB_SHA_SHORT env var is empty (prefix not applied)"
            exit 1
          fi
          echo "PASS: MY_GITHUB_SHA=$MY_GITHUB_SHA MY_GITHUB_SHA_SHORT=$MY_GITHUB_SHA_SHORT"
